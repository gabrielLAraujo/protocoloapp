# Build and tests for every PR, feature branch and main (backend, frontend, Docker image, Android APK); merging waits for all green.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a running check, but never a run on main: it may be in the middle of publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors comes from Directory.Build.props: a warning breaks the build.
      # The build also writes frontend/openapi.json (Microsoft.Extensions.ApiDescription.Server).
      - name: Build
        run: |
          set -o pipefail
          dotnet build --no-restore -nologo 2>&1 | tee ../build.log

      # Build errors become annotations: job logs are not downloadable through the API, annotations are.
      - name: Build errors
        if: ${{ failure() }}
        working-directory: .
        run: |
          grep -E ': (error|warning) ' build.log | sort -u | head -9 | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true

      - name: Upload generated OpenAPI
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: frontend/openapi.json
          if-no-files-found: warn

      # Fails when the EF model changed without a migration (generate it with a [migration:<Name>] commit, see codegen.yml).
      - name: EF model matches the migrations
        run: |
          set -o pipefail
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ProtocoloApp.Api --startup-project src/ProtocoloApp.Api --no-build 2>&1 | tee ../ef.log

      - name: EF check errors
        if: ${{ failure() }}
        working-directory: .
        run: |
          grep -v '^\s*$' ef.log | tail -n 8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true

      # The integration tests start a Postgres in a container (Testcontainers); the runner already has Docker.
      - name: Tests
        run: dotnet test --no-build --logger "trx" --results-directory TestResults

      # Counts and each failed test become job annotations, readable through the API without downloading the log.
      - name: Test summary
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}

          def prop(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")

          def message(text):
              return " ".join(text.split())[:900].replace("%", "%25")

          counts = {"Passed": 0, "Failed": 0}
          others = 0
          for path in glob.glob("TestResults/*.trx"):
              for result in ET.parse(path).getroot().iterfind(".//t:UnitTestResult", ns):
                  outcome = result.get("outcome")
                  if outcome in counts:
                      counts[outcome] += 1
                  else:
                      others += 1
                  if outcome == "Failed":
                      error = result.findtext(".//t:ErrorInfo/t:Message", default="", namespaces=ns)
                      print(f"::error title={prop(result.get('testName', '?'))}::{message(error)}")

          print(f"::notice title=Backend tests::{counts['Passed']} passed, {counts['Failed']} failed, {others} skipped.")

      # Fails when the committed frontend/openapi.json differs from the one this build generated. Intent-to-add makes a
      # generated-but-never-committed file count as a difference too.
      - name: OpenAPI is up to date
        working-directory: .
        run: |
          git add --intent-to-add frontend/openapi.json
          git diff --exit-code -- frontend/openapi.json

      # Artifacts and job logs are not downloadable through the API, annotations are: show the generated file there.
      - name: Show generated OpenAPI
        if: ${{ failure() }}
        working-directory: .
        shell: python
        run: |
          import pathlib

          text = pathlib.Path("frontend/openapi.json").read_text() if pathlib.Path("frontend/openapi.json").exists() else "(missing)"
          print("::error title=Generated frontend/openapi.json::" + text[:60000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))

  # hashFiles() is not available in a job-level `if`, so a tiny job tells whether the front exists yet.
  detect-frontend:
    name: Detect frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v5

      - id: detect
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    # The front does not exist until its task; the job is skipped while frontend/package.json is absent.
    needs: detect-frontend
    if: ${{ needs.detect-frontend.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint and types
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Same image Coolify builds on every push to main. Here we only check that it builds; nothing is published.
      - name: Build the image
        run: |
          set -o pipefail
          docker build --progress=plain -f backend/Dockerfile -t protocoloapp:ci . 2>&1 | tee docker.log

      - name: Image build errors
        if: ${{ failure() }}
        run: |
          tail -n 12 docker.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true

  # APK. Debug on PRs and feature branches (artifact to install and test). On main: signed release published as a GitHub
  # Release when the signing secrets exist (see docs/ci/README.md); without them it falls back to debug with a warning.
  android:
    name: Android APK
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write access only here, and only used by the release step on main.
    permissions:
      contents: write
    env:
      VITE_API_URL: https://protocolo.frauchesgabriel.work
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@v5

      - name: Install
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      # Builds the web app (with VITE_API_URL baked in) and copies it into the Android project.
      - name: Build web app and sync Capacitor
        working-directory: frontend
        run: npm run cap:sync

      # Secrets cannot be tested in `if`, so a step turns them into an output.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          release=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              release=true
            else
              echo "::warning title=Android release skipped::One or more signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Building the debug APK only."
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: ${{ steps.signing.outputs.release != 'true' }}
        working-directory: frontend/android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME" --no-daemon

      - name: Upload debug APK
        if: ${{ steps.signing.outputs.release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: protocolo-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Write keystore
        if: ${{ steps.signing.outputs.release == 'true' }}
        working-directory: frontend/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.release == 'true' }}
        working-directory: frontend/android
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "protocolo-$VERSION_NAME.apk"

      - name: Publish GitHub Release
        if: ${{ steps.signing.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Protocolo ${{ env.VERSION_NAME }}
          files: frontend/android/protocolo-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true

      - name: Remove signing material
        if: ${{ always() && steps.signing.outputs.release == 'true' }}
        working-directory: frontend/android
        run: rm -f release.jks keystore.properties
