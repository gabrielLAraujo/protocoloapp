# Build and tests for every PR, feature branch and main (backend, frontend, Docker image, Android APK); merging waits for all green.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

# Keyed on the branch (head_ref for PRs, ref_name for pushes), so the push run and the pull_request run of the same commit
# collapse into one: the later one cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # A newer push replaces a running check, but never a run on main: it may be in the middle of publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors comes from Directory.Build.props: a warning breaks the build.
      # The build also writes frontend/openapi.json (Microsoft.Extensions.ApiDescription.Server).
      - name: Build
        run: |
          set -o pipefail
          dotnet build --no-restore -nologo 2>&1 | tee ../build.log

      # Build errors become annotations: job logs are not downloadable through the API, annotations are.
      - name: Build errors
        if: ${{ failure() }}
        working-directory: .
        run: |
          grep -E ': (error|warning) ' build.log | sort -u | head -9 | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true

      - name: Upload generated OpenAPI
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: frontend/openapi.json
          if-no-files-found: warn

      # Fails when the EF model changed without a migration (generate it with a [migration:<Name>] commit, see codegen.yml).
      - name: EF model matches the migrations
        run: |
          set -o pipefail
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ProtocoloApp.Api --startup-project src/ProtocoloApp.Api --no-build 2>&1 | tee ../ef.log

      - name: EF check errors
        if: ${{ failure() }}
        working-directory: .
        run: |
          grep -v '^\s*$' ef.log | tail -n 8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true

      # The integration tests start a Postgres in a container (Testcontainers); the runner already has Docker.
      - name: Tests
        run: dotnet test --no-build --logger "trx" --results-directory TestResults

      # Counts and each failed test become job annotations, readable through the API without downloading the log.
      - name: Test summary
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}

          def prop(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")

          def message(text):
              return " ".join(text.split())[:900].replace("%", "%25")

          counts = {"Passed": 0, "Failed": 0}
          others = 0
          for path in glob.glob("TestResults/*.trx"):
              for result in ET.parse(path).getroot().iterfind(".//t:UnitTestResult", ns):
                  outcome = result.get("outcome")
                  if outcome in counts:
                      counts[outcome] += 1
                  else:
                      others += 1
                  if outcome == "Failed":
                      error = result.findtext(".//t:ErrorInfo/t:Message", default="", namespaces=ns)
                      print(f"::error title={prop(result.get('testName', '?'))}::{message(error)}")

          print(f"::notice title=Backend tests::{counts['Passed']} passed, {counts['Failed']} failed, {others} skipped.")

      # Fails when the committed frontend/openapi.json differs from the one this build generated. Intent-to-add makes a
      # generated-but-never-committed file count as a difference too.
      - name: OpenAPI is up to date
        working-directory: .
        run: |
          git add --intent-to-add frontend/openapi.json
          git diff --exit-code -- frontend/openapi.json

      # Artifacts and job logs are not downloadable through the API, annotations are: show the generated file there.
      - name: Show generated OpenAPI
        if: ${{ failure() }}
        working-directory: .
        shell: python
        run: |
          import pathlib

          text = pathlib.Path("frontend/openapi.json").read_text() if pathlib.Path("frontend/openapi.json").exists() else "(missing)"
          print("::error title=Generated frontend/openapi.json::" + text[:60000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))

  # hashFiles() is not available in a job-level `if`, so a tiny job tells whether the front exists yet.
  detect-frontend:
    name: Detect frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v5

      - id: detect
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    # The front does not exist until its task; the job is skipped while frontend/package.json is absent.
    needs: detect-frontend
    if: ${{ needs.detect-frontend.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint and types
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Same image Coolify builds on every push to main. Here we only check that it builds; nothing is published.
      - name: Build the image
        run: |
          set -o pipefail
          docker build --progress=plain -f backend/Dockerfile -t protocoloapp:ci . 2>&1 | tee docker.log

      - name: Image build errors
        if: ${{ failure() }}
        run: |
          tail -n 12 docker.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true

  # The offline-first promise end to end: the real API (published like the image, serving the built front) on a real Postgres,
  # and two browsers. Two small Node stubs (frontend/e2e/fixtures) stand in for the outside world: the Anthropic API (plan
  # import) and the R2 bucket (the PDF upload); the API reaches them through Anthropic__BaseUrl and R2__ServiceUrl.
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: protocoloapp
          POSTGRES_PASSWORD: e2e-only-password
          POSTGRES_DB: protocoloapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protocoloapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The OpenAPI document is committed and checked by the backend job; building here must not regenerate it.
      OpenApiGenerateDocumentsOnBuild: 'false'
      ConnectionStrings__Db: Host=localhost;Port=5432;Database=protocoloapp;Username=protocoloapp;Password=e2e-only-password
      Auth__SigningKey: e2e-only-signing-key-0123456789-abcdefghijklmnop
      R2__AccountId: e2e-account
      R2__AccessKeyId: e2e-access-key
      R2__SecretAccessKey: e2e-secret-key-not-real
      R2__Bucket: e2e-bucket
      R2__ServiceUrl: http://127.0.0.1:9101
      Anthropic__ApiKey: test
      Anthropic__BaseUrl: http://127.0.0.1:9100
      E2E_ANTHROPIC_STUB_URL: http://127.0.0.1:9100
      ASPNETCORE_URLS: http://localhost:5190
      E2E_BASE_URL: http://localhost:5190
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: Senha-e2e-123456
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the front
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      # Same layout as the Docker image: the API publish output with the front in wwwroot.
      - name: Publish the API with the front
        working-directory: backend
        run: |
          dotnet publish src/ProtocoloApp.Api/ProtocoloApp.Api.csproj -c Release -o "$RUNNER_TEMP/api" -nologo
          cp -r ../frontend/dist "$RUNNER_TEMP/api/wwwroot"

      - name: Apply migrations
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef database update --project src/ProtocoloApp.Api --startup-project src/ProtocoloApp.Api --connection "$ConnectionStrings__Db"

      # The only way to get a user, as in production.
      - name: Create the user
        working-directory: ${{ runner.temp }}/api
        env:
          PROTOCOLOAPP_PASSWORD: ${{ env.E2E_PASSWORD }}
        run: dotnet ProtocoloApp.Api.dll create-user "$E2E_EMAIL"

      - name: Start the Anthropic and storage stubs
        run: |
          nohup node frontend/e2e/fixtures/anthropic-stub.mjs 9100 > "$RUNNER_TEMP/anthropic-stub.log" 2>&1 &
          nohup node frontend/e2e/fixtures/storage-stub.mjs 9101 > "$RUNNER_TEMP/storage-stub.log" 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9100/__requests > /dev/null 2>&1 && curl -fsS http://127.0.0.1:9101/e2e-bucket/ > /dev/null 2>&1; then echo "Stubs are up"; exit 0; fi
            sleep 0.5
          done
          echo "Stubs did not start"; cat "$RUNNER_TEMP"/*-stub.log; exit 1

      - name: Start the API
        working-directory: ${{ runner.temp }}/api
        run: |
          nohup dotnet ProtocoloApp.Api.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5190/health > /dev/null 2>&1; then echo "API is up"; exit 0; fi
            sleep 1
          done
          echo "API did not start"; tail -n 30 "$RUNNER_TEMP/api.log"; exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee "$RUNNER_TEMP/playwright.log"

      # Light and dark screenshots of the main screens at 390x844 (e2e/screens.spec.ts), for visual review.
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: frontend/e2e-screenshots
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      # Artifacts and job logs are not downloadable through the API, annotations are.
      - name: E2E errors
        if: ${{ failure() }}
        run: |
          echo "::error title=Playwright::$(tail -n 40 "$RUNNER_TEMP/playwright.log" 2>/dev/null | tr '\n' '|' | cut -c1-900)"
          echo "::error title=API exceptions::$(grep -iE 'exception|error' "$RUNNER_TEMP/api.log" 2>/dev/null | grep -v '\"RequestPath\"' | head -n 12 | cut -c1-300 | tr '\n' '|' | cut -c1-1500)"
          echo "::error title=API 500 entries::$(grep -E '\"StatusCode\":500' "$RUNNER_TEMP/api.log" 2>/dev/null | tail -n 2 | cut -c1-1200 | tr '\n' '|' | cut -c1-1500)"
          echo "::error title=Stub logs::$(tail -n 8 "$RUNNER_TEMP/storage-stub.log" 2>/dev/null | tr '\n' '|' | cut -c1-600)"
          echo "::error title=API log::$(grep -E '"RequestPath":"/api' "$RUNNER_TEMP/api.log" 2>/dev/null | jq -r '"\(.RequestMethod) \(.RequestPath) \(.StatusCode)"' | tail -n 25 | tr '\n' '|' | cut -c1-900)"

  # Debug APK on every run (artifact to install and test). The signed release is a separate job below.
  android:
    name: Android APK
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: https://protocolo.frauchesgabriel.work
      VERSION_NAME: 0.1.${{ github.run_number }}
      # The update check compares this with the latest GitHub release.
      VITE_APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@v5

      - name: Install
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      # Builds the web app (with VITE_API_URL baked in) and copies it into the Android project.
      - name: Build web app and sync Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME" --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: protocolo-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # Signed release as a GitHub Release, only on main and only after every other job passed (see docs/ci/README.md).
  # Without the signing secrets it warns and does nothing.
  release:
    name: Android release
    needs: [android, backend, frontend, image, e2e]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job with write access.
    permissions:
      contents: write
    env:
      VITE_API_URL: https://protocolo.frauchesgabriel.work
      VERSION_NAME: 0.1.${{ github.run_number }}
      # The update check compares this with the latest GitHub release.
      VITE_APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Secrets cannot be tested in `if`, so a step turns them into an output.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Android release skipped::One or more signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@v5
        if: ${{ steps.signing.outputs.enabled == 'true' }}

      - name: Install
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Build web app and sync Capacitor
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        working-directory: frontend
        run: npm run cap:sync

      - name: Write keystore
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Outside the workspace, deleted right after the build. app/build.gradle finds it through ANDROID_KEYSTORE_PROPERTIES
        # (set here: the runner context is not available in a job-level env).
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          chmod 700 "$dir"
          echo "$KEYSTORE" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "ANDROID_KEYSTORE_PROPERTIES=$dir/keystore.properties" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        working-directory: frontend/android
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/protocolo-$VERSION_NAME.apk"

      # Right after the build (even a failed one) and before anything is published.
      - name: Remove signing material
        if: ${{ always() && steps.signing.outputs.enabled == 'true' }}
        run: rm -rf "$RUNNER_TEMP/signing"

      # gh instead of a third-party action: the token only goes to GitHub's own CLI.
      - name: Publish GitHub Release
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ env.VERSION_NAME }}
        run: |
          apk="$RUNNER_TEMP/protocolo-$VERSION_NAME.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "Protocolo $VERSION_NAME" --notes "Build ${GITHUB_SHA::7}."
          fi
